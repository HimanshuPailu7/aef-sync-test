name: Sync GitHub Issues to ServiceNow

on:
  issues:
    types: [opened, closed]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Sync issue to ServiceNow
        env:
          SNOW_INSTANCE: ${{ secrets.SNOW_INSTANCE }}
          SNOW_USER: ${{ secrets.SNOW_USER }}
          SNOW_PASSWORD: ${{ secrets.SNOW_PASSWORD }}
          SNOW_TABLE: ${{ vars.SNOW_TABLE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_STATE: ${{ github.event.issue.state }}
          EVENT_ACTION: ${{ github.event.action }}
          ISSUE_ASSIGNEE: ${{ github.event.issue.assignee.login }}
          ISSUE_LABELS: ${{ toJson(github.event.issue.labels.*.name) }}
        run: python scripts/snow_sync.py

      - name: Notify on failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            curl -X POST -H 'Content-Type: application/json' \
              -d "{\"text\":\"⚠️ SNOW sync failed for issue #${{ github.event.issue.number }} (${{ github.event.issue.html_url }})\"}" \
              "$WEBHOOK_URL"
          fi
